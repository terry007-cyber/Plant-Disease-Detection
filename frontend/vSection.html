<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesfa - Plant Videos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --primary: #27ae60;
  --dark: #2c3e50;
}
body {
  margin: 0;
  font-family: sans-serif;
  color: #fff;
  background: url('https://img.freepik.com/premium-photo/cracked-earth-globe-with-small-plant-growing-out-it-field-dry-land_559896-9630.jpg') center/cover fixed;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: -1;
}
.header {
  background: rgba(39,174,96,0.9);
  padding: 1rem;
  position: sticky;
  top: 0;
  text-align: center;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1rem;
}
.cat-nav {
  display: flex;
  overflow-x: auto;
  padding: 1rem 0;
  gap: 0.5rem;
  scrollbar-width: none;
}
.cat-nav::-webkit-scrollbar {
  display: none;
}
.cat-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.cat-btn:hover {
  background: rgba(255,255,255,0.2);
}
.cat-btn.active {
  background: #fff;
  color: var(--dark);
  font-weight: 600;
}
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1rem;
  padding: 1rem 0;
}
.video-card {
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  overflow: hidden;
}
.video-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.video-thumb {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #f0f0f0;
  overflow: hidden;
}
.video-thumb video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.video-thumb::before {
  content: "\f144";
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  font-size: 2rem;
  color: white;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  text-shadow: 0 0 10px rgba(0,0,0,0.5);
  opacity: 0.8;
  transition: opacity 0.2s;
}
.video-card:hover .video-thumb::before {
  opacity: 1;
}
.video-time {
  position: absolute;
  bottom: 5px;
  right: 5px;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 0.2rem 0.4rem;
  border-radius: 3px;
  font-size: 0.7rem;
  z-index: 2;
}
.video-info {
  padding: 0.8rem;
  background: rgba(255,255,255,0.1);
}
.video-title {
  display: -webkit-box;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  max-height: 2.6em;
  line-height: 1.3;
  margin: 0;
  font-size: 0.9rem;
}
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  z-index: 1000;
}
.player {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.player-header {
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.7);
}
.close-btn {
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  background: rgba(255,255,255,0.2);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-container video {
  width: 100%;
  max-height: 80vh;
  object-fit: contain;
}
.lang-am { display: none; }
.lang-en { display: inline; }
body.amharic .lang-am { display: inline; }
body.amharic .lang-en { display: none; }
@media (max-width: 768px) {
  .video-grid { grid-template-columns: 1fr 1fr; }
  .video-container video { max-height: 60vh; }
}
</style>
</head>
<body>

</div>

function createVideoThumbnail(videoSrc) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.src = videoSrc;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'metadata';
    
    video.onloadedmetadata = () => {
      video.currentTime = 0.1; // Get first frame
    };
    
    video.onseeked = () => {
      resolve(video);
    };
    
    video.onerror = () => {
      // Fallback if video fails to load
      const fallback = document.createElement('div');
      fallback.style.width = '100%';
      fallback.style.height = '100%';
      fallback.style.background = '#ddd';
      resolve(fallback);
    };
  });
}

async function renderVideos(cat = 'all') {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = '';
  
  const filtered = cat === 'all' ? videos : videos.filter(v => v.cat === cat);
  
  if(filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center">
      <i class="fas fa-video-slash"></i>
      <p class="lang-en">No videos</p><p class="lang-am">ቪዲዮ የለም</p>
    </div>`;
    return;
  }
  
  for (const v of filtered) {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.onclick = () => openVideo(v.src, v.titleEn, v.titleAm);
    
    card.innerHTML = `
      <div class="video-thumb">
        <span class="video-time">${v.duration}</span>
      </div>
      <div class="video-info">
        <h3 class="video-title">
          <span class="lang-en">${v.titleEn}</span>
          <span class="lang-am">${v.titleAm}</span>
        </h3>
      </div>
    `;
    
    const thumbContainer = card.querySelector('.video-thumb');
    const thumbVideo = await createVideoThumbnail(v.src);
    thumbContainer.insertBefore(thumbVideo, thumbContainer.firstChild);
    
    grid.appendChild(card);
  }
}

function openVideo(src, titleEn, titleAm) {
  const modal = document.getElementById('videoModal');
  const player = document.getElementById('videoPlayer');
  const title = document.getElementById('videoModalTitle');
  
  player.src = src;
  title.innerHTML = `<span class="lang-en">${titleEn}</span><span class="lang-am">${titleAm}</span>`;
  modal.style.display = 'block';
  
  // Reset and play
  player.load();
  player.play().catch(e => console.log("Autoplay prevented:", e));
}

function closeModal() {
  document.getElementById('videoModal').style.display = 'none';
  const player = document.getElementById('videoPlayer');
  player.pause();
  player.currentTime = 0;
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    renderVideos(this.dataset.cat);
  });
});

window.toggleLanguage = function() {
  document.body.classList.toggle('amharic');
};

document.addEventListener('DOMContentLoaded', () => renderVideos());
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());
</script>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesfa - Plant Books</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --primary: #27ae60;
  --dark: #2c3e50;
}
body {
  margin: 0;
  font-family: sans-serif;
  color: #fff;
  background: url('https://img.freepik.com/premium-photo/cracked-earth-globe-with-small-plant-growing-out-it-field-dry-land_559896-9630.jpg') center/cover fixed;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: -1;
}
.header {
  background: rgba(39,174,96,0.9);
  padding: 1rem;
  position: sticky;
  top: 0;
  text-align: center;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1rem;
}
.cat-nav {
  display: flex;
  overflow-x: auto;
  padding: 1rem 0;
  gap: 0.5rem;
  scrollbar-width: none;
}
.cat-nav::-webkit-scrollbar {
  display: none;
}
.cat-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.cat-btn:hover {
  background: rgba(255,255,255,0.2);
}
.cat-btn.active {
  background: #fff;
  color: var(--dark);
  font-weight: 600;
}
.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1.5rem;
  padding: 1rem 0;
}
.book-card {
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  overflow: hidden;
  padding: 1rem;
  text-align: center;
}
.book-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  background: rgba(255,255,255,0.2);
}
.book-icon {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
  color: var(--primary);
}
.book-info {
  padding: 0.5rem;
}
.book-title {
  display: -webkit-box;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  max-height: 2.6em;
  line-height: 1.3;
  margin: 0 0 0.3rem 0;
  font-size: 0.9rem;
}
.book-author {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.8);
  margin: 0;
  display: -webkit-box;
  line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.lang-am { display: none; }
.lang-en { display: inline; }
body.amharic .lang-am { display: inline; }
body.amharic .lang-en { display: none; }
@media (max-width: 768px) {
  .book-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<header class="header">
  <button class="nav-btn" onclick="window.location.href='home.html'">
    <i class="fas fa-arrow-left"></i>
    <span class="lang-en">Previous</span>
    <span class="lang-am">ቀዳሚ</span>
  </button>
  <h1><span class="lang-en">Plant Books</span><span class="lang-am">የተክል መጻሕፍት</span></h1>
  <div style="width: 120px;"></div> <!-- Spacer for alignment -->
</header>

<div class="container">
  <div class="cat-nav">
    <button class="cat-btn active" data-cat="all">
      <i class="fas fa-globe"></i>
      <span class="lang-en">All</span><span class="lang-am">ሁሉም</span>
    </button>
    <button class="cat-btn" data-cat="corn">
      <i class="fas fa-corn"></i>
      <span class="lang-en">Corn</span><span class="lang-am">በቆሎ</span>
    </button>
    <button class="cat-btn" data-cat="grapes">
      <i class="fas fa-wine-bottle"></i>
      <span class="lang-en">Grapes</span><span class="lang-am">ወይን</span>
    </button>
    <button class="cat-btn" data-cat="tomato">
      <i class="fas fa-apple-alt"></i>
      <span class="lang-en">Tomato</span><span class="lang-am">ቲማቲም</span>
    </button>
    <button class="cat-btn" data-cat="potato">
      <i class="fas fa-potato"></i>
      <span class="lang-en">Potato</span><span class="lang-am">ድንች</span>
    </button>
  </div>

  <div class="book-grid" id="bookGrid"></div>
</div>

<script>
const books = [
  {
    titleEn: 'Corn Diseases Handbook',
    titleAm: 'የበቆሎ በሽታዎች መመርያ',
    authorEn: 'UNITED  STATES DEPARTMENT OF AGRICULTURE IN  COOPERATION  WITH PURDUE  UNIVERSITY AGRICULTURAL EXPERIMENT STATION',
    authorAm: 'ዩናይትድ ስቴተት የግብርና ክፍል ጋር በመተባበር PURDUE ዩኒቨርሲቲ ግብርና የሙከራ ጣቢያ',
    cat: 'corn',
    pdf: 'books/CORN.pdf'
  },
    {
    titleEn: 'Corn Disease Management',
    titleAm: 'የበቆሎ በሽታዎች መመርያ',
    authorEn: 'R.E. Stuckey, Natl. Assoc. Wheat Growers Foundation; T.L. Niblack, University of Missouri; R.F. Nyvall, University of Minnesota; J.P. Krausz, Clemson University; andC.W. Horne, Texas A&M University',
    authorAm: 'አር.ኢ. ስቱኪ ፣ ናት. አሶሴክ. የስንዴ አምራቾች ፋውንዴሽን; ቲ.ኤል. Niblack, ሚዙሪ ዩኒቨርሲቲ; አር.ኤፍ. ኒቫል, የሚኒሶታ ዩኒቨርሲቲ; J.P. Krausz, ክሌምሰን ዩኒቨርሲቲ; እና C.W. Horne, ቴክሳስ A&M ዩኒቨርሲቲ',
    cat: 'corn',
    pdf: 'books/Corn Disease Management.pdf'
  },
  {
    titleEn: 'Grape Cultivation Guide',
    titleAm: 'የወይን እርባታ መመርያ',
    authorEn: 'Wisconsin grape growers association',
    authorAm: 'ዋይስኮንሲን የወይን አሳሳቢዎች ማህበር',
    cat: 'grapes',
    pdf: 'books/Grape-Growing-101-WI-Grape-Growers-Ass.pdf'
  },
  {
    titleEn: 'Tomato Grower\'s Handbook',
    titleAm: 'የቲማቲም አምራች መመርያ',
    authorEn: 'Mississippi State University.',
    authorAm: 'ሚሲሲፒ ግዛት ዩኒቨርሲቲ',
    cat: 'tomato',
    pdf: 'books/Greenhouse Tomato.pdf'
  },
  {
    titleEn: 'Potato Disease Management',
    titleAm: 'የድንች በሽታ አስተዳደር',
    authorEn: 'Spud Specialists',
    authorAm: 'የድንች ባለሙያዎች',
    cat: 'potato',
    pdf: 'books/Mgmt of potato diseases in home garden.pdf'
  },
  {
    titleEn: 'Organic Farming Methods',
    titleAm: 'ኦርጋኒክ የግብርና ዘዴዎች',
    authorEn: 'EDITORS Santanu Kundu  Ashay D Souza  Lalta Prasad Verma Tushar Ghosh,Debarati Seal ',
    authorAm: 'ግሪን አምባ ህትመት',
    cat: 'all',
    pdf: 'books/organic-farming-methods.pdf'
  }
];

function renderBooks(cat = 'all') {
  const grid = document.getElementById('bookGrid');
  grid.innerHTML = '';
  
  const filtered = cat === 'all' ? books : books.filter(b => b.cat === cat || b.cat === 'all');
  
  if(filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center">
      <i class="fas fa-book-open"></i>
      <p class="lang-en">No books found</p><p class="lang-am">መጻሕፍት አልተገኙም</p>
    </div>`;
    return;
  }
  
  filtered.forEach(b => {
    const card = document.createElement('div');
    card.className = 'book-card';
    card.onclick = () => window.open(b.pdf, '_blank');
    
    card.innerHTML = `
      <div class="book-icon">
        <i class="fas fa-book"></i>
      </div>
      <div class="book-info">
        <h3 class="book-title">
          <span class="lang-en">${b.titleEn}</span>
          <span class="lang-am">${b.titleAm}</span>
        </h3>
        <p class="book-author">
          <span class="lang-en">${b.authorEn}</span>
          <span class="lang-am">${b.authorAm}</span>
        </p>
      </div>
    `;
    
    grid.appendChild(card);
  });
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    renderBooks(this.dataset.cat);
  });
});

window.toggleLanguage = function() {
  document.body.classList.toggle('amharic');
};

document.addEventListener('DOMContentLoaded', () => renderBooks());
</script>
</body>
</html>
